name: Optimize brand images (review artifact only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimize-brand-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image encoder
        run: npm install --no-save --no-package-lock sharp

      - name: Generate modern logo formats and update references
        run: node scripts/optimize-brand-assets.mjs

      - name: Create review patch
        run: git diff --binary > brand-assets-review.patch

      - name: Upload optimized assets and review patch (no Git push)
        uses: actions/upload-artifact@v4
        with:
          name: optimized-brand-assets-review
          path: |
            images/mta-logo-horizontal.webp
            images/mta-logo-horizontal.avif
            images/mta-logo-square.webp
            images/mta-logo-square.avif
            brand-assets-review.patch
          if-no-files-found: error
          retention-days: 14
