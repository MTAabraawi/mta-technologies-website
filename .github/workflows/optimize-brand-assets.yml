name: Optimize brand images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimize-brand-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image encoder
        run: npm install --no-save sharp

      - name: Generate modern logo formats and update references
        run: node scripts/optimize-brand-assets.mjs

      - name: Save generated patch
        run: git diff --binary > /tmp/brand-assets-optimization.patch

      - name: Upload optimized assets and patch
        uses: actions/upload-artifact@v4
        with:
          name: optimized-brand-assets
          path: |
            images/*.webp
            images/*.avif
            /tmp/brand-assets-optimization.patch
          if-no-files-found: warn
