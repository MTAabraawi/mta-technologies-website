name: Optimize brand images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-brand-assets.yml'
      - 'scripts/optimize-brand-assets.mjs'
      - 'images/mta-logo-horizontal.png'
      - 'images/mta-logo-square.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-brand-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image encoder
        run: npm install --no-save sharp

      - name: Generate modern logo formats and update references
        run: node scripts/optimize-brand-assets.mjs

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/mta-logo-horizontal.webp images/mta-logo-horizontal.avif images/mta-logo-square.webp images/mta-logo-square.avif
          git add -u
          if git diff --cached --quiet; then
            echo "No optimized image changes to commit."
          else
            git commit -m "Optimize brand logos as WebP and AVIF"
            git push origin HEAD:main
          fi
