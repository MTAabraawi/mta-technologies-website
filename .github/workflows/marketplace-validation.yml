name: Marketplace code validation

on:
  pull_request:
    branches: [main, mta-website-upgrade]
  push:
    branches: [mta-website-upgrade]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Pages Functions dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check marketplace-api/src/index.js
          node --check functions/api/_middleware.js
          node --check 'functions/api/[[path]].js'
          node --check js/apps.js
          node --check js/external-catalogs.js
          node --check js/developer-portal.js
          node --check js/admin-marketplace.js
          node --check js/admin-certificates.js
          node --check js/developer-certification.js
          node --check js/verify-certificate.js
          node --check js/credential-card.js
          node -e "JSON.parse(require('fs').readFileSync('data/store-directory.json','utf8')); JSON.parse(require('fs').readFileSync('data/curated-apps.json','utf8'));"
      - name: Validate fresh D1 schema
        run: python -c "import sqlite3,pathlib; db=sqlite3.connect(':memory:'); db.executescript(pathlib.Path('marketplace-api/schema.sql').read_text()); print('D1 schema applied successfully')"
