name: Refresh multiplatform app catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2,5"

permissions:
  contents: write

concurrency:
  group: mta-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Build metadata-only catalog
        run: python3 scripts/build_multiplatform_catalog.py
      - name: Commit catalog when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog is unchanged."
          else
            git commit -m "Refresh multiplatform app catalog"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
