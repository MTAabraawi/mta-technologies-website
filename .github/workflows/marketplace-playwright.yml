name: Marketplace Playwright

on:
  pull_request:
    branches: [main]
    paths:
      - "apps.html"
      - "js/apps.js"
      - "css/**"
      - "marketplace-config.js"
      - "tests/e2e/**"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/marketplace-playwright.yml"
  push:
    branches: [feature/store-specific-marketplace]
    paths:
      - "apps.html"
      - "js/apps.js"
      - "css/**"
      - "marketplace-config.js"
      - "tests/e2e/**"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/marketplace-playwright.yml"

permissions:
  contents: read

concurrency:
  group: marketplace-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run marketplace tests against Cloudflare branch preview
        env:
          MTA_BASE_URL: https://feature-store-specific-marke.mta-technologies-website.pages.dev
        run: npm run test:e2e
