name: MTA Marketplace E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/global-store-catalog-expansion, feature/mta-ai-apps-store]
    paths:
      - '*.html'
      - 'css/style.css'
      - 'css/home-carousel.css'
      - 'js/main.js'
      - 'apps.html'
      - 'store.html'
      - 'js/apps.js'
      - 'js/store.js'
      - 'js/store-directory.js'
      - 'css/apps.css'
      - 'css/store.css'
      - 'data/ai-apps.json'
      - 'sitemap-pages.xml'
      - 'sitemap.xml'
      - 'marketplace-config.js'
      - 'functions/**'
      - 'tests/e2e/**'
      - 'tests/fixtures/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/marketplace-e2e.yml'
  push:
    branches: [main, feature/global-store-catalog-expansion, feature/mta-ai-apps-store, audit-seo-marketplace-commercial-hardening, work/final-premerge-website-2026-11-23]
    paths:
      - '*.html'
      - 'css/style.css'
      - 'css/home-carousel.css'
      - 'css/apps.css'
      - 'css/store.css'
      - 'data/ai-apps.json'
      - 'js/main.js'
      - 'apps.html'
      - 'js/apps.js'
      - 'js/store.js'
      - 'js/store-directory.js'
      - 'sitemap-pages.xml'
      - 'sitemap.xml'
      - 'marketplace-config.js'
      - 'functions/**'
      - 'tests/e2e/**'
      - 'tests/fixtures/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/marketplace-e2e.yml'

permissions:
  contents: read

concurrency:
  group: marketplace-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-check:
    name: Chromium marketplace checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start deterministic catalogue upstream fixture
        run: |
          node tests/fixtures/catalogue-upstream.js > /tmp/mta-catalogue-fixture.log 2>&1 &
          echo $! > /tmp/mta-catalogue-fixture.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8789/api/v1/catalog-stats > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8789/api/v1/catalog-stats
      - name: Start local Cloudflare Pages with Functions
        run: |
          nohup npx --yes wrangler@4 pages dev . --ip 127.0.0.1 --port 8788 --binding 'MTA_APPLICATIONS_ENGINE_ORIGIN=http://127.0.0.1:8789' > /tmp/mta-pages-dev.log 2>&1 &
          echo $! > /tmp/mta-pages-dev.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8788/apps.html > /dev/null; then
              echo 'Cloudflare Pages dev server is ready'
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/mta-pages-dev.pid)" 2>/dev/null; then
              echo 'Cloudflare Pages dev server exited unexpectedly'
              cat /tmp/mta-pages-dev.log
              exit 1
            fi
            sleep 2
          done
          echo 'Cloudflare Pages dev server did not become ready'
          cat /tmp/mta-pages-dev.log
          exit 1
      - name: Run marketplace browser tests
        env:
          MTA_BASE_URL: http://127.0.0.1:8788
        run: npm run test:e2e
      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/mta-pages-dev.log
            /tmp/mta-catalogue-fixture.log
          if-no-files-found: ignore
          retention-days: 7
