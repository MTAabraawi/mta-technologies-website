name: MTA Marketplace E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps.html'
      - 'js/apps.js'
      - 'css/apps.css'
      - 'marketplace-config.js'
      - 'functions/**'
      - 'functions/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/marketplace-e2e.yml'
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'apps.html'
      - 'js/apps.js'
      - 'css/apps.css'
      - 'marketplace-config.js'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/marketplace-e2e.yml'

permissions:
  contents: read

concurrency:
  group: marketplace-e2e
  cancel-in-progress: true

jobs:
  browser-check:
    name: Chromium marketplace checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local Cloudflare Pages with Functions
        run: |
          nohup npx --yes wrangler@4 pages dev . --port 8788 > /tmp/mta-pages-dev.log 2>&1 &
          echo $! > /tmp/mta-pages-dev.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8788/apps.html > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8788/apps.html > /dev/null
      - name: Run marketplace browser tests
        env:
          MTA_BASE_URL: http://127.0.0.1:8788
        run: npm run test:e2e
      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
